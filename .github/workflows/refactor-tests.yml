name: ADK Constructor v2 tests
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression tests
        run: node tests/run-tests.mjs
      - name: Install browser automation dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Run Chrome mobile and print checks
        run: node tests/browser-e2e.mjs
